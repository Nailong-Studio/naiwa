<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="pixel.css"><style>body{background:#e8ecd6;color:#263a30;font-family:system-ui;margin:20px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.card{background:#fff8e2;padding:8px;text-align:center;min-height:85px}.item-texture{display:block;margin:auto;width:52px;height:52px}canvas{width:960px;max-width:100%;image-rendering:pixelated;background:#d1d8bd}</style><h1>新版道具与奶伴美术验收</h1><canvas width="960" height="360"></canvas><div class="grid"></div><script type="module">import{ITEMS}from'./campaign.js';import{itemIcon}from'./item-icons.js';import{drawSprite}from'./sprite-art.js';document.querySelector('.grid').innerHTML=ITEMS.map(i=>'<div class="card">'+itemIcon(i)+i.name+'</div>').join('');const c=document.querySelector('canvas').getContext('2d');function draw(){c.clearRect(0,0,960,360);for(let r=0;r<5;r++)for(let f=0;f<4;f++){const file=r<2?'penguins-actions-v1.png':'meme-followers-v1.png',row=r<2?r:r-1;drawSprite(c,file,f,row,4,r<2?2:4,70+f*150,r*70+60,55)}drawSprite(c,'ghostbuddha-v1.png',0,0,1,1,800,220,130);requestAnimationFrame(draw)}draw();</script>
