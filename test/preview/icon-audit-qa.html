<!doctype html><meta charset="utf-8"><title>全部道具图标验收</title><link rel="stylesheet" href="pixel.css"><style>body{background:#f2e8ce;color:#263f35;font:14px system-ui;padding:20px}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.card{background:#fff7e5;border:1px solid #b8b891;text-align:center;padding:8px;min-height:80px}.card p{margin:4px}.item-texture{width:48px;height:48px}</style><h1>全部道具图标</h1><div class="grid" id="icons"></div><script type="module">import {ITEMS} from './campaign.js';const SUPPLIES=[{id:'supply_key',name:'钥匙'},{id:'supply_bomb',name:'炸弹'},{id:'supply_heart',name:'补血'}];import {SERVICES} from './shop-services.js';import {EXCHANGES} from './resource-scenes.js';import {itemIcon} from './item-icons.js';icons.innerHTML=[...ITEMS,...SUPPLIES,...SERVICES,...EXCHANGES].map(i=>'<div class="card" data-id="'+i.id+'">'+itemIcon(i)+'<p>'+i.name+'</p></div>').join('')</script>
